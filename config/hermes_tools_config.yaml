# Terminal backend
terminal:
  backend: local  # Proceeding with local for ease of use, shielded by approval_required: true
  timeout: 180
  
# Browser automation
browser:
  driver: "chrome"
  headless: true
  window_size: [1920, 1080]

# Web search
web_search:
  engines: [duckduckgo]
  max_results: 10
  requests_per_minute: 60

# Vision analysis
vision:
  model: "basic"  # Fallback to local image processing where possible
  max_image_size: 10485760  # 10MB

# Code execution
code_execution:
  sandbox: true    # Important: ensures Python scripts run in isolated sub-environments
  timeout: 30
  max_memory: 512  # MB
